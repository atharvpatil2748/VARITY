[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "1.0.0"
description = "VERITY - Your documents. Your specs. Evidence that Cline can cite."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "httpx>=0.28"]
mcp = ["mcp==2.3.0"]
http = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.setuptools]
packages = ["verity", "verity.mcp", "verity.http"]

[tool.pytest.ini_options]
testpaths = ["tests"]
