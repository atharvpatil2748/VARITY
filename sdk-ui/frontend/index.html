<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VERITY Ã¢â‚¬â€ Your documents. Your specs. Evidence that Cline can cite.</title>
  <style>
    :root {
      --bg: #f1f5f9; --surface: #ffffff; --border: #e2e8f0;
      --text: #0f172a; --muted: #64748b;
      --primary: #4f46e5; --primary-soft: #eef2ff;
      --ok: #059669; --ok-soft: #ecfdf5;
      --warn: #d97706; --warn-soft: #fffbeb;
      --bad: #dc2626; --bad-soft: #fef2f2;
      --unknown: #475569; --unknown-soft: #f1f5f9;
      --sidebar: #0f172a; --sidebar-text: #cbd5e1;
      --radius: 14px; --shadow: 0 1px 3px rgb(15 23 42 / .06);
      --shadow-lg: 0 10px 30px rgb(15 23 42 / .10);
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Inter, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font-size: 14.5px; line-height: 1.55; }
    .layout { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
    aside { background: var(--sidebar); color: var(--sidebar-text);
            padding: 22px 14px; position: sticky; top: 0; height: 100vh;
            display: flex; flex-direction: column; gap: 4px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px;
             margin-bottom: 22px; }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px;
                  background: linear-gradient(135deg, #6366f1, #8b5cf6);
                  display: grid; place-items: center; color: #fff;
                  font-weight: 800; font-size: 15px; box-shadow: var(--shadow-lg); }
    .brand-name { font-weight: 700; color: #fff; font-size: 16px; letter-spacing: .3px; }
    .brand-tag { font-size: 10.5px; color: #7c8aa5; margin-top: -2px; }
    nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px;
            margin: 2px 0; border-radius: 10px; color: var(--sidebar-text);
            text-decoration: none; font-weight: 500; font-size: 13.5px;
            transition: background .15s, color .15s; }
    nav a:hover { background: rgb(255 255 255 / .06); color: #fff; }
    nav a.active { background: var(--primary); color: #fff;
                   box-shadow: 0 4px 14px rgb(79 70 229 / .45); }
    nav a svg { width: 17px; height: 17px; flex: none; opacity: .85; }
    .sidebar-foot { margin-top: auto; padding: 10px 12px; font-size: 11px;
                    color: #64748b; border-top: 1px solid rgb(255 255 255 / .08); }
    main { padding: 30px 38px; max-width: 1060px; }
    main > h2 { margin: 0; font-size: 21px; font-weight: 700; }
    #view { margin-top: 18px; }
    h2 { font-size: 18px; margin: 6px 0 12px; font-weight: 700; }
    h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted);
         text-transform: uppercase; letter-spacing: .6px; }
    .card { background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 15px 18px; margin-top: 12px;
            box-shadow: var(--shadow); transition: box-shadow .15s; }
    .card:hover { box-shadow: var(--shadow-lg); }
    .card-list { list-style: none; padding: 0; }
    .muted { color: var(--muted); display: block; }
    blockquote { margin: 10px 0; padding: 10px 14px; border: none;
                 border-left: 3px solid var(--primary); background: var(--primary-soft);
                 border-radius: 0 10px 10px 0; font-style: normal; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px 14px;
          border-radius: 10px; overflow-x: auto; font-size: 12px; margin: 8px 0; }
    code { background: var(--unknown-soft); border: 1px solid var(--border);
           padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }
    button, select, input[type="text"], input[type="search"], input[type="file"] {
      font: inherit; border-radius: 9px; border: 1px solid var(--border);
      padding: 8px 13px; background: var(--surface); color: var(--text); }
    button { cursor: pointer; font-weight: 600; transition: filter .15s, transform .05s; }
    button:hover { filter: brightness(.96); }
    button:active { transform: translateY(1px); }
    button[type="submit"] { background: var(--primary); border-color: var(--primary);
                            color: #fff; box-shadow: 0 3px 12px rgb(79 70 229 / .35); }
    button.link { background: none; border: none; color: var(--primary);
                  padding: 0; box-shadow: none; font-weight: 600; }
    .status-pill { padding: 3px 11px; border-radius: 999px; font-size: 11.5px;
                   font-weight: 700; display: inline-block; margin-left: 8px;
                   letter-spacing: .4px; }
    .status-IMPLEMENTED, .IMPLEMENTATED, .status-ready
      { background: var(--ok-soft); color: var(--ok); }
    .status-PARTIAL, .PARTIAL, .status-partial
      { background: var(--warn-soft); color: var(--warn); }
    .status-MISSING, .MISSING, .status-failed
      { background: var(--bad-soft); color: var(--bad); }
    .status-UNCERTAIN, .UNCERTAIN, .status-pending
      { background: var(--unknown-soft); color: var(--unknown); }
    .kind { margin-left: 8px; font-size: 12px; color: var(--muted);
            background: var(--unknown-soft); border-radius: 6px; padding: 2px 8px; }
    .document-head, .coverage-head, .evidence-head { display: flex;
      align-items: center; gap: 6px; flex-wrap: wrap; }
    .warnings { color: var(--warn); font-size: 13px; }
    .search-form, .upload-form { display: flex; gap: 10px; align-items: center;
                                 flex-wrap: wrap; }
    .upload-form { flex-direction: column; align-items: stretch; max-width: 460px; }
    .upload-ok { background: var(--ok-soft); border-radius: 10px; padding: 10px 12px; }
    .error-card { border-color: #fecaca; background: var(--bad-soft); }
    .error-card strong { color: var(--bad); }
    .spans summary { cursor: pointer; color: var(--primary); margin-top: 8px;
                     font-weight: 600; }
    .span-item { margin: 8px 0 12px; }
    .transcript { display: flex; flex-direction: column; }
    .chat-message { max-width: 85%; }
    .chat-message.user { align-self: flex-end; background: var(--primary);
                         border-color: var(--primary); color: #fff; }
    .chat-message.user .muted { color: #dfe3ff; }
    .chat-message.user blockquote { background: rgb(255 255 255 / .12);
                                    border-left-color: #fff; color: #fff; }
    .evidence-chip { padding: 10px 14px; }
    .loading-state { padding: 4px 0; }
    .loading-state .sk { height: 13px; border-radius: 6px; margin: 9px 0;
      background: linear-gradient(90deg, #eef1f6 25%, #f8fafc 50%, #eef1f6 75%);
      background-size: 200% 100%; animation: shimmer 1.1s infinite; }
    .loading-state .sk:nth-child(2) { width: 70%; }
    .loading-state .sk:nth-child(3) { width: 45%; }
    @keyframes shimmer { from { background-position: 200% 0; }
                         to { background-position: -200% 0; } }
    .empty-state { color: var(--muted); }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; height: auto; flex-direction: row;
              flex-wrap: wrap; align-items: center; }
      .brand { margin-bottom: 0; }
      .sidebar-foot { display: none; }
      main { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand">
        <div class="brand-mark">V</div>
        <div>
          <div class="brand-name">VERITY</div>
          <div class="brand-tag">Evidence that Cline can cite</div>
        </div>
      </div>
      <nav>
        <a href="#" data-view="documents" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h10l6 6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M14 4v6h6"/></svg>
          Documents</a>
        <a href="#" data-view="sources">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/></svg>
          Sources</a>
        <a href="#" data-view="upload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0l-5 5m5-5l5 5"/><path d="M4 20h16"/></svg>
          Upload</a>
        <a href="#" data-view="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          Search</a>
        <a href="#" data-view="coverage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
          Coverage</a>
        <a href="#" data-view="chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Chat</a>
      </nav>
      <div class="sidebar-foot">
        contract 1.0.0 · loopback only<br>?api=real switches to the live API
      </div>
    </aside>
    <main>
      <!-- U2-U6 views render here via views/app.js; data comes only from the
           typed API client (mock by default, real /api/v1 with ?api=real). -->
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
  <script type="module" src="./views/app.js"></script>
</body>
</html>
